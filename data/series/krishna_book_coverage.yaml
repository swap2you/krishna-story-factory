# Krishna Book chapter-event coverage ledger (Bhāva V1.7.2+)
# A chapter may map to multiple stories. Never compress a major pastime
# merely to preserve one-story-per-chapter. Recap/preview mentions are NOT coverage.

schema_version: 1
reviewer: Svarna Gauranga Das
updated_for_release: v1.7.2

rules:
  - recap_mention_is_not_coverage: true
  - preview_mention_is_not_coverage: true
  - one_sentence_mention_is_not_full_coverage_of_major: true
  - later_chapter_events_must_not_leak: true

