        source_boundary: heavy in lap through residents recover Kṛṣṇa
        significance: major
        summary: Heavy in Yaśodā's lap; Tṛṇāvarta whirlwind; dust; neck caught; demon falls; Kṛṣṇa safe
        mapped_stories: ["011"]
        lifecycle: pending
        reviewer: Svarna Gauranga Das
        notes: Follows cart-breaking; not Story 010
