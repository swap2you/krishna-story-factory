story_no: "027"
kb_chapter: 19
title: "Devouring the Forest Fire"
source_url: "https://vedabase.io/en/library/kb/19/"
reviewer_state: pending_owner_content_review
adaptation_notes: >
  Age-adapted retelling of Krishna Book Ch.19 only. Goats, cows, and buffalo
  wander into Ishikatavi for fresh grass; boys follow footprints and eaten grass;
  boys become tired and thirsty; they hear the cows; Krishna calls the cows by
  name and the herd replies; friends appeal to Krishna and Balarama; Krishna
  swallows the fire; upon awakening they are in Bhandira forest; evening return
  to Vrindavana playing flutes. Fire motion in every visual must be unmistakably
  inward toward Krishna—never blown or exhaled outward.
