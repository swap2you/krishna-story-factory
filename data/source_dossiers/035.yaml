title: "Prayers by Indra, the King of Heaven"
source_url: "https://vedabase.io/en/library/kb/27/"
reviewer_state: pending_owner_content_review
adaptation_notes: >
  Govardhana sequence part 4 — Krishna Book Ch.27 only. Begin AFTER the rescue.
  Indra approaches Krishna privately/secluded, bows, admits pride and offense, and
  recognizes Krishna's supremacy. Include Krishna's instruction: delegated opulence
  comes from Him; removing false prestige can be mercy; Indra should return to his
  duty without pride. Include Surabhi's prayer, the milk abhisheka, Indra's celestial
  Ganges water through Airavata, Krishna honored as Govinda, flower showers, restored
  abundance, and Indra's return with permission. Do NOT open with "Indra stopped the
  rain" as a Chapter 27 action — the clouds were already withdrawn at the end of Ch.25.
