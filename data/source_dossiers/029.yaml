adaptation_notes: >
  COMPLETE REWRITE from Krishna Book Ch.21 only — not from prior drafts.
  Canonical setup: in beautiful autumn, Krishna and Balarama enter the forest with
  cows and cowherd boys; Krishna plays His flute; the gopis remain in Vraja and
  speak among themselves while remembering Him and describing the flute's effects.
  Include a child-appropriate selection of effects on peacocks, deer, cows/calves,
  birds, Yamuna, clouds, Govardhana, and moving/nonmoving beings. Preserve the
  conclusion that remaining absorbed in thoughts of Krishna is the example of
  Krishna consciousness. STRICTLY PROHIBITED (later rasa-lila chapters, not Ch.21):
  night/moonlit rendezvous as the main setup; gopis leaving homes or duties; gopis
  entering the forest to meet Krishna; Krishna meeting them there; Krishna teaching
  them there. Keep attraction transcendental and child-safe — not ordinary romance.
