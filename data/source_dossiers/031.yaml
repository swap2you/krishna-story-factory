title: "Delivering the Wives of the Brahmanas Who Performed Sacrifices"
source_url: "https://vedabase.io/en/library/kb/23/"
reviewer_state: pending_owner_content_review
adaptation_notes: >
  Age-adapted retelling of Krishna Book Ch.23. Include: hungry cowherd boys;
  Krishna's first instruction to approach the brahmanas; their refusal; the second
  request to the wives; the wives carrying food despite relatives' resistance;
  their meeting with Krishna; Krishna directing them to return home; their return
  and acceptance; the boys eating the food; the brahmanas' later repentance.
  Treat the brahmanas respectfully. The contrast is ritual knowledge without
  recognition versus sincere devotion — not ridicule or caricature.
