title: "Balarama Protects His Friends from Pralambasura"
source_url: "https://vedabase.io/en/library/kb/18/"
reviewer_state: pending_owner_content_review
adaptation_notes: >
  Age-adapted retelling of Krishna Book Ch.18 only (summer Vrindavana play,
  then Pralambasura). Preserve: Balarama's party won; Krishna carried Sridama;
  Bhadrasena carried Vrishabha; Pralambasura carried Balarama far away; demon
  assumed his real form; Balarama struck his head with His fist; boys rushed to
  the spot, praised and embraced Balarama; demigods showered flowers. Do not
  invent "early one morning" as a required setup. Do not invent the boys searching
  and calling until they found Him—after the fall they rush to the spot. Never say
  Krishna's team won or that Balarama deliberately grew heavier.
