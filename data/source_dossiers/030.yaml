adaptation_notes: >
  senior_review required — senior devotional review is mandatory and cannot be
  self-approved. Strict child-safe, respectful, non-sensational telling of Krishna
  Book Ch.22: month-long Katyayani vow; early Yamuna worship; desire for Krishna as
  husband; Krishna understanding their hearts; taking the garments; the girls'
  appeal; respectful return of the garments; Krishna's promise concerning the next
  autumn; later praise of the charitable trees and their service to others (unless
  the title/source line clearly says adapted selection rather than complete chapter).
  Do not place editorial notes, moderation instructions, or visual-production
  directions in spoken narration. Do not use words like "naked" or "nude" in
  narration. Do not falsify the event by claiming the source says the gopis were
  already draped; use tasteful indirect wording and composition only.
