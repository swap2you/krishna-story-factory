adaptation_notes: >
  Govardhana sequence part 2 — Krishna Book Ch.25 only. Include Indra's pride and
  Samvartaka clouds; thunder/hail/cold; cows shielding calves; residents' prayer;
  Krishna lifting Govardhana on the little finger of His left hand; everyone with
  property and animals sheltering safely for seven days; Indra ordering the clouds
  to stop; Krishna replacing the hill; residents' affectionate embraces and
  blessings. Do NOT include Indra's later prayers or Surabhi's abhisheka (Ch.27).
