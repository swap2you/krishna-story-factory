adaptation_notes: >
  COMPLETE REWRITE from Krishna Book Ch.26 only — not from prior drafts.
  Canonical setup occurs AFTER the Govardhana rescue. The cowherd men discuss
  Krishna's extraordinary activities (Putana, the cart, Trinavarta, the twin trees,
  Bakasura, Vatsasura, Dhenukasura, Pralambasura, the forest fire, Kaliya, and
  Govardhana). They ask Nanda Maharaja how such a seven-year-old boy can perform
  these wonders and why everyone is so naturally attracted to Him. Nanda recounts
  Garga Muni's statements about Krishna's colors, names, prior identity as Vasudeva,
  auspicious protection, and qualities like Vishnu/Narayana. Close with the cowherd
  community satisfied and praying to remain under wonderful Krishna's protection.
  STRICTLY PROHIBITED: presenting this chapter as life continuing under the lifted
  hill; chanting or sharing food under the hill; re-narrating the storm as the main
  plot (those belong to Ch.25 action, not Ch.26's retrospective discussion).
