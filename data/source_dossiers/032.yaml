adaptation_notes: >
  Govardhana sequence part 1 — Krishna Book Ch.24 only. Include Nanda's planned
  Indra sacrifice and Krishna's inquiry/dialogue; cow protection and Vraja's
  prescribed work; Annakuta foods; honoring brahmanas, cows, animals, and people
  with prasadam; decorated cows and circumambulation; Krishna assuming the great
  Govardhana form and accepting the offerings; villagers' joyful completion.
  Present Krishna's argument in a child-appropriate way without flattening it into
  a modern environmental message. Do NOT include the storm, hill lifting, or
  seven-day shelter (those are Ch.25).
