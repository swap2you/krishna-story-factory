adaptation_notes: >
  Krishna Book Ch.20 covers the rainy season and its transition into autumn, with
  many devotional comparisons, Krishna and Balarama's forest life near Govardhana
  and the Yamuna, clear autumn water and sky, lotuses, harvest/offerings where
  source-supported, and movement toward the gopis' feeling of separation. Retell a
  representative, coherent progression through both seasons. Do not invent farmer
  dialogue, fruit-picking excursions, or specific events absent from the chapter.
  If the adaptation is intentionally selective, label it "adapted from Chapter 20"
  — never claim "Complete Chapter 20" for a selective retelling.
