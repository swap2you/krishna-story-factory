name: Provision public content
description: >
  Download the approved public Stories release, verify it against the committed
  digest, validate its structure, and extract it into output/.

runs:
  using: composite
  steps:
    - name: Read committed content pin
      id: pin
      shell: bash
      run: |
        python - <<'PY' >> "$GITHUB_OUTPUT"
        import json, pathlib
        pin = json.loads(pathlib.Path("deploy/content/RELEASE_CONTENT.json").read_text(encoding="utf-8"))
        for key in ("tag", "bundle", "sha256", "public_story_max"):
            print(f"{key}={pin[key]}")
        PY

    - name: Download release bundle
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        mkdir -p "$RUNNER_TEMP/bhava-content"
        gh release download "${{ steps.pin.outputs.tag }}" \
          --pattern "${{ steps.pin.outputs.bundle }}" \
          --dir "$RUNNER_TEMP/bhava-content"

    - name: Verify bundle against committed digest
      shell: bash
      run: |
        cd "$RUNNER_TEMP/bhava-content"
        echo "${{ steps.pin.outputs.sha256 }}  ${{ steps.pin.outputs.bundle }}" > expected.sha256
        sha256sum -c expected.sha256

    - name: Validate bundle structure and per-file hashes
      shell: bash
      run: |
        python scripts/deployment/validate_public_content.py \
          --bundle "$RUNNER_TEMP/bhava-content/${{ steps.pin.outputs.bundle }}" \
          --max-story "${{ steps.pin.outputs.public_story_max }}"

    - name: Extract into output/ and data/web-assets/
      shell: bash
      run: |
        tar -xzf "$RUNNER_TEMP/bhava-content/${{ steps.pin.outputs.bundle }}" -C "$GITHUB_WORKSPACE"
        python - <<'PY'
        import json, os, pathlib, sys
        root = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
        pin = json.loads((root / "deploy/content/RELEASE_CONTENT.json").read_text(encoding="utf-8"))
        max_story = int(pin["public_story_max"])
        output = root / "output"
        web_assets = root / "web-assets"
        for n in (20, 21, 22, 23, 24, 25):
            if n <= max_story:
                assert list(output.glob(f"{n:03d}_*")), f"Story {n:03d} missing from output/"
        if max_story >= 26:
            assert list(output.glob("026_*")), "Story 026 must be present when public_story_max >= 26"
        if max_story >= 35:
            assert list(output.glob("035_*")), "Story 035 must be present when public_story_max >= 35"
        next_private = max_story + 1
        assert not list(output.glob(f"{next_private:03d}_*")), (
            f"Story {next_private:03d} must remain excluded from public content"
        )
        for n in (1, 21, 22, 23, 24, 25):
            if n <= max_story:
                assert (web_assets / f"{n:03d}").is_dir(), f"web-assets/{n:03d} missing"
        if max_story >= 26:
            assert (web_assets / "026").is_dir(), "web-assets/026 must be present"
        if max_story >= 35:
            assert (web_assets / "035").is_dir(), "web-assets/035 must be present"
        assert not (web_assets / f"{next_private:03d}").is_dir(), (
            f"web-assets/{next_private:03d} must remain absent"
        )
        PY
        mkdir -p data
        rm -rf data/web-assets
        mv web-assets data/web-assets
        python - <<'PY'
        import json, os, pathlib
        root = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
        pin = json.loads((root / "deploy/content/RELEASE_CONTENT.json").read_text(encoding="utf-8"))
        max_story = int(pin["public_story_max"])
        web_assets = root / "data/web-assets"
        for n in (1, 20, 21, 22, 23, 24, 25):
            if n <= max_story:
                assert (web_assets / f"{n:03d}" / "web_manifest.json").is_file()
        if max_story >= 26:
            assert (web_assets / "026" / "web_manifest.json").is_file()
        if max_story >= 35:
            assert (web_assets / "035" / "web_manifest.json").is_file()
        next_private = max_story + 1
        assert not (web_assets / f"{next_private:03d}" / "web_manifest.json").is_file()
        PY