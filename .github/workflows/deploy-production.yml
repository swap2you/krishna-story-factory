name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact main commit SHA to deploy; leave blank for current main
        required: false
      content_release_tag:
        description: Approved public content release
        required: true
        default: bhava-content-001-020-v2

permissions:
  contents: read

concurrency:
  group: bhava-production
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: release
        env:
          REQUESTED: ${{ inputs.commit_sha }}
        run: |
          git fetch origin main
          SHA="${REQUESTED:-$(git rev-parse origin/main)}"
          git cat-file -e "${SHA}^{commit}"
          git merge-base --is-ancestor "$SHA" origin/main
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  deploy:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
      url: https://bhava.me
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Build exact revision
        env:
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          docker build -f deploy/ionos/Dockerfile.web -t bhava-web:${RELEASE_SHA} .
          docker build -f deploy/ionos/Dockerfile.api -t bhava-api:${RELEASE_SHA} .
          docker save bhava-web:${RELEASE_SHA} bhava-api:${RELEASE_SHA} \
            | gzip -9 > bhava-images-${RELEASE_SHA}.tar.gz
          tar -czf bhava-config-${RELEASE_SHA}.tar.gz \
            -C deploy/ionos \
            docker-compose.yml Caddyfile runtime.env.example scripts

      - name: Download approved public content
        env:
          GH_TOKEN: ${{ github.token }}
          CONTENT_TAG: ${{ inputs.content_release_tag }}
        run: |
          gh release download "$CONTENT_TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "${CONTENT_TAG}.tar.gz" \
            --pattern "${CONTENT_TAG}.tar.gz.sha256"
          sha256sum --check "${CONTENT_TAG}.tar.gz.sha256"

      - name: Configure pinned SSH
        uses: ./.github/actions/configure-pinned-ssh
        with:
          ssh_key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.VPS_KNOWN_HOSTS }}

      - name: Transfer and deploy
        env:
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
          HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_PORT }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          scp -P "$PORT" \
            bhava-images-${RELEASE_SHA}.tar.gz \
            bhava-config-${RELEASE_SHA}.tar.gz \
            "${{ inputs.content_release_tag }}.tar.gz" \
            "${{ inputs.content_release_tag }}.tar.gz.sha256" \
            "$USER@$HOST:/opt/bhava/incoming/"
          CONTENT_TAG="${{ inputs.content_release_tag }}"
          CONTENT_SHA="$(awk '{print $1}' "${CONTENT_TAG}.tar.gz.sha256")"
          PUBLIC_MAX="$(python -c 'import json; print(json.load(open("deploy/content/RELEASE_CONTENT.json",encoding="utf-8"))["public_story_max"])')"
          ssh -p "$PORT" "$USER@$HOST" \
            "mkdir -p /opt/bhava/config && \
             tar -xzf /opt/bhava/incoming/bhava-config-${RELEASE_SHA}.tar.gz -C /opt/bhava/config && \
             chmod +x /opt/bhava/config/scripts/*.sh && \
             BHAVA_PUBLIC_STORY_MAX=${PUBLIC_MAX} bash /opt/bhava/config/scripts/install-content-bundle.sh \
               /opt/bhava/incoming/${CONTENT_TAG}.tar.gz ${CONTENT_TAG} ${CONTENT_SHA} && \
             bash /opt/bhava/config/scripts/deploy-release.sh production ${RELEASE_SHA} \
               /opt/bhava/incoming/bhava-images-${RELEASE_SHA}.tar.gz \
               /opt/bhava/incoming/bhava-config-${RELEASE_SHA}.tar.gz"

      - name: TLS / ACME readiness
        id: tls
        env:
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
        run: bash deploy/ionos/scripts/tls-readiness.sh https://bhava.me

      - name: Production application smoke
        id: smoke
        if: steps.tls.outcome == 'success'
        env:
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          SKIP_TLS_READINESS=1 bash deploy/ionos/scripts/smoke-test.sh \
            https://bhava.me "${RELEASE_SHA}" production

      - name: Confirm rollback pointer
        if: success()
        env:
          HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_PORT }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -p "$PORT" "$USER@$HOST" \
            'echo current=$(cat /opt/bhava/releases/production/current);
             if [ -f /opt/bhava/releases/production/previous ]; then
               echo previous=$(cat /opt/bhava/releases/production/previous);
               echo rollback_pointer_ready=1;
             else
               echo rollback_pointer_ready=0 first_or_same_release;
             fi'

      - name: Roll back on application smoke failure only
        if: failure() && steps.smoke.outcome == 'failure'
        env:
          HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_PORT }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          set +e
          out="$(ssh -p "$PORT" "$USER@$HOST" \
            "bash /opt/bhava/config/scripts/rollback-release.sh production" 2>&1)"
          rc=$?
          echo "$out"
          if echo "$out" | grep -q ROLLBACK_PERFORMED; then
            echo "Rollback performed."
            exit 0
          fi
          if echo "$out" | grep -q ROLLBACK_UNAVAILABLE_FIRST_RELEASE; then
            echo "Rollback unavailable (first production release). Leaving current release in place."
            exit 1
          fi
          echo "Rollback failed (exit $rc)."
          exit 1
