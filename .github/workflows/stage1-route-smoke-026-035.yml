name: Stage1 Route Smoke 026-035

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Per-story Stage 1 routes
        env:
          STAGING_BASIC_AUTH_USER: ${{ secrets.STAGING_BASIC_AUTH_USER }}
          STAGING_BASIC_AUTH_PASSWORD: ${{ secrets.STAGING_BASIC_AUTH_PASSWORD }}
          EXPECTED_SHA: 7b4b029e866da21c1253600f9e45cd5c3c2026e9
        run: |
          set -euo pipefail
          AUTH=(-u "${STAGING_BASIC_AUTH_USER}:${STAGING_BASIC_AUTH_PASSWORD}")
          BASE=https://staging.bhava.me
          ver="$(curl -fsS "${AUTH[@]}" "${BASE}/api/v1/version")"
          echo "$ver"
          echo "$ver" | grep -F "$EXPECTED_SHA" >/dev/null
          python3 - <<'PY'
          import json, os, sys, urllib.request
          from base64 import b64encode

          user = os.environ["STAGING_BASIC_AUTH_USER"]
          password = os.environ["STAGING_BASIC_AUTH_PASSWORD"]
          token = b64encode(f"{user}:{password}".encode()).decode()
          headers = {"Authorization": f"Basic {token}"}

          def code(url: str) -> int:
              req = urllib.request.Request(url, headers=headers, method="GET")
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      return resp.getcode()
              except urllib.error.HTTPError as exc:
                  return exc.code

          base = "https://staging.bhava.me"
          catalog = code(f"{base}/stories")
          assert catalog == 200, catalog
          rows = []
          for n in range(26, 36):
              sn = f"{n:03d}"
              page = code(f"{base}/stories/{sn}")
              api = code(f"{base}/api/v1/stories/{sn}")
              audio = code(f"{base}/api/v1/stories/{sn}/assets/narration.mp3")
              rows.append((sn, page, api, audio))
              print(f"{sn} page={page} api={api} audio={audio}")
              assert page == 200 and api == 200 and audio == 200, (sn, page, api, audio)
          p036 = code(f"{base}/stories/036")
          a036 = code(f"{base}/api/v1/stories/036")
          print(f"036 page={p036} api={a036}")
          assert p036 == 404 and a036 == 404, (p036, a036)
          hdr_req = urllib.request.Request(f"{base}/stories/026", headers=headers, method="HEAD")
          with urllib.request.urlopen(hdr_req, timeout=30) as resp:
              robots = resp.headers.get("X-Robots-Tag", "")
          print("X-Robots-Tag:", robots)
          assert "noindex" in robots.lower()
          print("STAGE1_ROUTE_SMOKE_PASS")
          PY
