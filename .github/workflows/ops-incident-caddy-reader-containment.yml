name: Ops Incident Caddy Reader Containment

# P0 temporary containment: deny production private reader projections at the
# edge while the permanent API catalog-first fix is merged and deployed.
# Uses staging SSH credentials (shared host). Does not touch staging.bhava.me.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: apply_deny or verify_only
        required: true
        type: choice
        options:
          - apply_deny
          - verify_only
        default: apply_deny

permissions:
  contents: read

concurrency:
  group: bhava-incident-caddy
  cancel-in-progress: false

jobs:
  contain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      # Shared VPS SSH credentials live on the staging GitHub Environment.
      # This job still only mutates the bhava.me (production) Caddy site block.
      # Dispatch with --ref develop (staging env allows develop).
      name: staging
      url: https://bhava.me
    steps:
      - uses: actions/checkout@v6

      - name: Configure pinned SSH
        uses: ./.github/actions/configure-pinned-ssh
        with:
          ssh_key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.VPS_KNOWN_HOSTS }}

      - name: Apply or verify production reader deny
        env:
          HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_PORT }}
          USER: ${{ secrets.VPS_USER }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/incident_caddy_patch.py
          from pathlib import Path
          print(Path("deploy/ionos/scripts/incident_caddy_reader_deny_patch.py").read_text(encoding="utf-8"))
          PY
          # Prefer committed patch helper when present; otherwise embed inline.
          if [[ -f deploy/ionos/scripts/incident_caddy_reader_deny_patch.py ]]; then
            cp deploy/ionos/scripts/incident_caddy_reader_deny_patch.py /tmp/incident_caddy_patch.py
          else
            cat > /tmp/incident_caddy_patch.py <<'PY'
          from pathlib import Path
          import re
          path = Path("/opt/bhava/config/Caddyfile")
          text = path.read_text(encoding="utf-8")
          marker = "INCIDENT_PRIVATE_READER_DENY_V2"
          block = """
          \t# INCIDENT_PRIVATE_READER_DENY_V2 temporary production-only containment
          \thandle /api/v1/stories/021/reader {
          \t\trespond 404
          \t}
          \thandle /api/v1/stories/021/reader.txt {
          \t\trespond 404
          \t}
          \thandle /api/v1/stories/022/reader {
          \t\trespond 404
          \t}
          \thandle /api/v1/stories/022/reader.txt {
          \t\trespond 404
          \t}
          """
          # Remove any prior V1/V2 incident blocks.
          text = re.sub(
              r"\n\t# INCIDENT_PRIVATE_READER_DENY_V[12].*?(?=\n\thandle |\n\t@|\n})",
              "\n",
              text,
              count=1,
              flags=re.S,
          )
          needle = "\thandle /api/* {\n\t\treverse_proxy api-production:8000\n\t}"
          # Scope replacement to bhava.me site only.
          parts = text.split("bhava.me {", 1)
          if len(parts) != 2:
              raise SystemExit("bhava.me site block missing")
          head, rest = parts
          site, tail = rest.split("\n}", 1)
          if needle not in site:
              raise SystemExit("production api handle block missing")
          site = site.replace(needle, block + "\n" + needle, 1)
          path.write_text(head + "bhava.me {" + site + "\n}" + tail, encoding="utf-8")
          print("caddy_incident_handle_deny_applied")
          PY
          fi
          scp -P "$PORT" /tmp/incident_caddy_patch.py "$USER@$HOST:/tmp/incident_caddy_patch.py"
          MODE_Q="$(printf '%q' "$MODE")"
          ssh -p "$PORT" "$USER@$HOST" "MODE=${MODE_Q} bash -s" <<'EOS'
          set -Eeuo pipefail
          CADDY=/opt/bhava/config/Caddyfile
          BACKUP="/opt/bhava/config/Caddyfile.incident-reader-backup.$(date -u +%Y%m%dT%H%M%SZ)"
          if [[ ! -f "$CADDY" ]]; then
            echo "missing Caddyfile" >&2
            exit 1
          fi
          if [[ "$MODE" == "apply_deny" ]]; then
            cp -a "$CADDY" "$BACKUP"
            echo "backed_up=$BACKUP"
            python3 /tmp/incident_caddy_patch.py
            cd /opt/bhava/config
            docker compose --env-file runtime.env exec -T caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
            docker compose --env-file runtime.env up -d --no-build --force-recreate --no-deps caddy
            sleep 5
            docker compose --env-file runtime.env ps caddy
          else
            echo "verify_only mode"
          fi
          EOS

      - name: Verify public containment
        run: |
          set -euo pipefail
          for path in \
            /api/v1/stories/021/reader \
            /api/v1/stories/021/reader.txt \
            /api/v1/stories/022/reader \
            /api/v1/stories/022/reader.txt
          do
            code="$(curl -sS -o /tmp/body.bin -w '%{http_code}' "https://bhava.me${path}" || true)"
            len="$(wc -c </tmp/body.bin | tr -d ' ')"
            sha="$(sha256sum /tmp/body.bin | awk '{print $1}')"
            echo "url=https://bhava.me${path} status=${code} length=${len} sha256=${sha}"
            [[ "$code" == "404" ]]
          done
          code020="$(curl -sS -o /dev/null -w '%{http_code}' https://bhava.me/api/v1/stories/020/reader || true)"
          echo "url=https://bhava.me/api/v1/stories/020/reader status=${code020}"
          [[ "$code020" == "200" ]]
          echo "containment_verified"
