[pytest]
norecursedirs =
    .git
    .venv
    node_modules
    MyPilotDropbox
    output
    work
    .codex_validation_tmp
markers =
    slow: long-running integration tests; skip in fast CI with -m "not slow"
    content_release: needs the immutable public Stories 001-020 release bundle in output/
    local_archive: needs private pre-copyright archives under output/_archive/ (never published)
    local_runtime: needs mutable operator runtime state such as tracking/queue_state.csv
    production_security: asserts the public production boundary (blocked routes, story ceiling)
